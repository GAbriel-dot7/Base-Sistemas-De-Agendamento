<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — SGCM</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div class="app-layout" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">
    <div class="card" style="width:100%;max-width:420px;padding:24px">
      <div style="text-align:center;margin-bottom:20px">
        <div style="font-size:2rem">🔐</div>
        <h1 style="margin:8px 0 4px 0;font-size:1.35rem">Entrar no SGCM</h1>
        <p style="margin:0;color:var(--text-muted)">Acesse com seu usuário para continuar</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email</label>
          <input id="loginEmail" type="email" class="form-control" placeholder="seu@email.com" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="loginSenha">Senha</label>
          <input id="loginSenha" type="password" class="form-control" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px">Entrar</button>
      </form>

      <div style="margin-top:14px;font-size:0.8rem;color:var(--text-muted)">
        <div>Admin: admin@sistema.com / admin123</div>
        <div>Atendente: atendente@sistema.com / atendente123</div>
      </div>
    </div>
  </div>

  <div class="notifications-wrapper" id="notificationsWrapper"></div>

  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
